name = "scholar-desk"
main = "worker/index.js"
compatibility_date = "2026-11-21"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
[[d1_databases]]
binding = "DB"
database_name = "scholar-desk"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "scholar-desk-videos"
[vars]
APP_NAME = "Scholar Desk"
RAZORPAY_MODE = "test"
